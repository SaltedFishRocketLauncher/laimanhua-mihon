name: Build LaiManHua Extension

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Generate signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore laimanhua.keystore \
            -alias laimanhua \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass laimanhua -keypass laimanhua \
            -dname "CN=LaiManHua, OU=Ext, O=LaiManHua, L=NA, ST=NA, C=CN"

      - name: Generate Wrapper
        run: gradle wrapper --gradle-version 8.2 2>&1 | tee build-log.txt

      - name: Build APK
        id: build
        continue-on-error: true
        run: |
          ./gradlew assembleRelease --stacktrace --no-daemon 2>&1 | tee -a build-log.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Commit build log for diagnosis
        if: always()
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          tail -c 60000 build-log.txt > log.txt || cp build-log.txt log.txt
          git add -f log.txt
          git commit -m "ci: build log [skip ci]" || echo "nothing to commit"
          git push || echo "push failed"

      - name: List APK output
        if: always()
        run: find . -name "*.apk" -type f || true

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laimanhua-apk
          path: build/outputs/apk/release/*.apk
          if-no-files-found: warn
