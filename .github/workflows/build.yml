name: Build LaiManHua Extension

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Generate signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore laimanhua.keystore \
            -alias laimanhua \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass laimanhua -keypass laimanhua \
            -dname "CN=LaiManHua, OU=Ext, O=LaiManHua, L=NA, ST=NA, C=CN"

      - name: Build APK
        run: |
          gradle wrapper --gradle-version 8.2
          ./gradlew assembleRelease --stacktrace

      - name: Verify APK contents
        if: always()
        run: |
          APK=$(find build/outputs/apk/release -name "*.apk" | head -1)
          echo "APK=$APK"
          {
            echo "APK path: $APK"
            echo "Size: $(stat -c %s "$APK" 2>/dev/null) bytes"
            echo "---- manifest (aapt) ----"
            AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt2 | head -1)
            "$AAPT" dump xmltree --file AndroidManifest.xml "$APK" 2>&1 | head -40
            echo "---- dex classes ----"
            unzip -l "$APK" | head -20
          } > verify.txt 2>&1
          cat verify.txt

      - name: Commit verification result
        if: always()
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -f verify.txt
          git commit -m "ci: apk verify [skip ci]" || echo "nothing to commit"
          git push || echo "push failed"

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laimanhua-apk
          path: build/outputs/apk/release/*.apk
          if-no-files-found: warn
