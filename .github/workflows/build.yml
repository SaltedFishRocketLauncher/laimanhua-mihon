name: Build LaiManHua Extension

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Generate signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore laimanhua.keystore \
            -alias laimanhua \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass laimanhua -keypass laimanhua \
            -dname "CN=LaiManHua, OU=Ext, O=LaiManHua, L=NA, ST=NA, C=CN"

      - name: Generate Wrapper & Build APK
        run: gradle wrapper --gradle-version 8.2 && ./gradlew assembleRelease --stacktrace --info

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            build/reports/**
            **/build/outputs/logs/**
          if-no-files-found: ignore

      - name: List APK output
        if: always()
        run: find . -name "*.apk" -type f || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: laimanhua-apk
          path: build/outputs/apk/release/*.apk
          if-no-files-found: warn
