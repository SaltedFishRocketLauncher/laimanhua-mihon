name: Build LaiManHua Extension

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Generate Wrapper & Build APK
        run: gradle wrapper --gradle-version 8.2 && ./gradlew assembleRelease --stacktrace

      - name: List APK output
        if: always()
        run: find . -name "*.apk" -type f || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: laimanhua-apk
          path: build/outputs/apk/release/*.apk
          if-no-files-found: warn
