name: Build & Publish Extension Repo

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  STORE_NAME: LaiManHua
  BADGE: LMH
  PKG: eu.kanade.tachiyomi.extension.zh.laimanhua
  SRC_NAME: 来漫画
  SRC_ID: "8642197532516"
  LANG: zh
  BASE_URL: https://www.laimanhua88.com
  REPO_BRANCH: repo

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Gradle 8.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      # 固定 keystore：多次构建必须签名一致，否则 Mihon 拒绝覆盖安装。
      # 优先级：Secrets > repo 分支已存档 > 首次生成（随后会存档到 repo 分支）
      - name: Prepare signing keystore
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > laimanhua.keystore
            echo "使用 Secrets 中的 keystore"
            exit 0
          fi
          if git fetch origin "$REPO_BRANCH" --depth 1 2>/dev/null &&              git show "origin/$REPO_BRANCH:signing/laimanhua.keystore" > laimanhua.keystore 2>/dev/null &&              [ -s laimanhua.keystore ]; then
            echo "复用 repo 分支已存档的 keystore"
          else
            rm -f laimanhua.keystore
            keytool -genkeypair -v -keystore laimanhua.keystore -alias laimanhua -keyalg RSA -keysize 2048 -validity 10000 -storepass laimanhua -keypass laimanhua -dname "CN=LaiManHua, OU=Ext, O=LaiManHua, L=NA, ST=NA, C=CN"
            echo "首次生成 keystore，将随索引存档到 repo 分支"
          fi

      - name: Build APK
        run: |
          set -e
          gradle wrapper --gradle-version 8.2
          VCODE=$(git rev-list --count HEAD)
          echo "VCODE=$VCODE"
          ./gradlew assembleRelease --stacktrace \
            -PversionCode="$VCODE" -PversionName="1.4.${VCODE}"

      - name: Generate repo index
        run: |
          set -e
          APK=$(find build/outputs/apk/release -name "*.apk" | head -1)
          echo "APK=$APK"
          VCODE=$(git rev-list --count HEAD)
          REPO_BASE="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${REPO_BRANCH}"
          python3 index-gen/gen_index.py \
            --apk "$APK" \
            --pkg "$PKG" \
            --name "$SRC_NAME" \
            --source-name "$SRC_NAME" \
            --source-id "$SRC_ID" \
            --lang "$LANG" \
            --base-url "$BASE_URL" \
            --version-code "$VCODE" \
            --version-name "1.4.${VCODE}" \
            --store-name "$STORE_NAME" \
            --badge "$BADGE" \
            --website "https://github.com/${GITHUB_REPOSITORY}" \
            --repo-base "$REPO_BASE" \
            --out dist
          echo "---- 校验 index.pb ----"
          python3 index-gen/decode_pb.py dist/index.pb

      - name: Publish to repo branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          mkdir -p dist/signing
          cp laimanhua.keystore dist/signing/laimanhua.keystore
          cd dist
          git init -q
          git checkout -q -b "$REPO_BRANCH"
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          cat > README.md <<'RMEOF'
          # 扩展仓库索引（自动生成，勿手改）

          Mihon 添加地址（复制到「设置 → 浏览 → 扩展仓库」）：

          ```
          REPO_URL_PLACEHOLDER
          ```
          RMEOF
          sed -i "s|REPO_URL_PLACEHOLDER|https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${REPO_BRANCH}/index.min.json|" README.md
          git add -A
          git commit -q -m "repo: build $(date -u +%Y%m%d-%H%M%S) v${VCODE}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$REPO_BRANCH"

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laimanhua-apk
          path: build/outputs/apk/release/*.apk
          if-no-files-found: warn
