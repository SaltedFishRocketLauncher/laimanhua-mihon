name: Build & Publish Extension Repo

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  STORE_NAME: LaiManHua
  BADGE: LMH
  PKG: eu.kanade.tachiyomi.extension.zh.laimanhua
  SRC_NAME: 来漫画
  SRC_ID: "8642197532516"
  LANG: zh
  BASE_URL: https://www.laimanhua88.com
  REPO_BRANCH: repo

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Gradle 8.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      # 固定 keystore：优先用 Secrets，没有则用仓库内 keystore 或生成一次
      - name: Prepare signing keystore
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > laimanhua.keystore
            echo "使用 Secrets 中的 keystore"
          elif [ -f laimanhua.keystore ]; then
            echo "使用仓库内已有 keystore"
          else
            keytool -genkeypair -v \
              -keystore laimanhua.keystore -alias laimanhua \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass laimanhua -keypass laimanhua \
              -dname "CN=LaiManHua, OU=Ext, O=LaiManHua, L=NA, ST=NA, C=CN"
            echo "已生成新 keystore（注意：每次构建指纹会变，正式使用请改用 Secrets）"
          fi

      - name: Build APK
        run: |
          gradle wrapper --gradle-version 8.2
          ./gradlew assembleRelease --stacktrace

      - name: Generate repo index
        run: |
          # 版本号从 APK 读取（脚本内用 aapt/openssl），无需手工同步
          APK=$(find build/outputs/apk/release -name "*.apk" | head -1)
          echo "APK=$APK"
          VCODE=$(git rev-list --count HEAD)
          VNAME="1.4.${VCODE}"
          REPO_BASE="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${REPO_BRANCH}"
          python3 index-gen/gen_index.py \
            --apk "$APK" \
            --pkg "$PKG" \
            --name "$SRC_NAME" \
            --source-name "$SRC_NAME" \
            --source-id "$SRC_ID" \
            --lang "$LANG" \
            --base-url "$BASE_URL" \
            --version-code "$VCODE" \
            --version-name "$VNAME" \
            --store-name "$STORE_NAME" \
            --badge "$BADGE" \
            --website "https://github.com/${GITHUB_REPOSITORY}" \
            --repo-base "$REPO_BASE" \
            --out dist
          echo "---- 校验 index.pb 可解码 ----"
          python3 index-gen/decode_pb.py dist/index.pb

      - name: Publish to repo branch
        run: |
          cd dist
          git init -q
          git checkout -q -b "$REPO_BRANCH"
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          printf '%s\n' '# 扩展仓库索引（自动生成，勿手改）' '' \
            'Mihon 添加地址：' '' \
            '```' \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${REPO_BRANCH}/index.min.json" \
            '```' > README.md
          git add -A
          git commit -q -m "repo: build $(date -u +%Y%m%d-%H%M%S)"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$REPO_BRANCH"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laimanhua-apk
          path: build/outputs/apk/release/*.apk
          if-no-files-found: warn
