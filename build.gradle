plugins {
    id 'com.android.application' version '8.2.2'
    id 'org.jetbrains.kotlin.android' version '1.9.22'
}

android {
    namespace 'eu.kanade.tachiyomi.extension.zh.laimanhua'
    compileSdk 34

    defaultConfig {
        applicationId 'eu.kanade.tachiyomi.extension.zh.laimanhua'
        minSdk 21
        targetSdk 34
        // 允许 CI 通过 -PversionCode / -PversionName 注入，保证 APK 与索引一致。
        // 用显式类型转换：findProperty 返回 String，直接 as Integer 在 Gradle 8.2
        // 会抛 IllegalArgumentException: Value is null（实测 build.gradle:15）
        versionCode Integer.parseInt(project.findProperty('versionCode')?.toString() ?: '1')
        versionName project.findProperty('versionName')?.toString() ?: '1.4.1'
    }

    signingConfigs {
        // CI 中由 workflow 用 keytool 生成；本地构建请自备同名 keystore
        release {
            storeFile file('laimanhua.keystore')
            storePassword 'laimanhua'
            keyAlias 'laimanhua'
            keyPassword 'laimanhua'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // 修正：keiyoushi/extensions-lib 在 jitpack 上仅有 1.4.2.1，原 1.5.4 不存在(404)
    compileOnly 'com.github.keiyoushi:extensions-lib:1.4.2.1'
    compileOnly 'com.squareup.okhttp3:okhttp:4.12.0'
    compileOnly 'org.jsoup:jsoup:1.17.2'
}
